name: Iglu 房态自动抓取

on:
  schedule:
    # 动态数据：每天 10:00 / 13:00 / 17:00（悉尼时间 = UTC+10）
    # 悉尼 10:00 = UTC 00:00, 13:00 = UTC 03:00, 17:00 = UTC 07:00
    # 每月 1 日、15 日自动附带静态抓取（面积/床型，每两周一次）
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
