name: Iglu 房态自动抓取

on:
  schedule:
    # 动态数据：每天 10:00 / 13:00 / 17:00（悉尼时间 = UTC+10）
    # 悉尼 10:00 = UTC 00:00, 13:00 = UTC 03:00, 17:00 = UTC 07:00
    # 每月 1 日、15 日自动附带静态抓取（面积/床型，每两周一次）
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判断抓取模式
        id: mode
        run: |
          # 每月1日/15日 = 静态抓取，其他 = 动态抓取
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=status" >> "$GITHUB_OUTPUT"
          fi

      - name: 运行抓取流水线
        run: python3 iglu_pipeline.py --mode ${{ steps.mode.outputs.mode }}

      - name: 提交更新（价格变化/页面更新）
        run: |
          git config user.name "iglu-bot"
          git config user.email "iglu-bot@users.noreply.github.com"
          git add -A
          # 有变化才提交（无变化时 git commit 会失败，|| true 忽略）
          git commit -m "auto: 房态数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "无变化，跳过提交"
          git push

      - name: 部署到 Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, uuid
          token = os.environ["CF_API_TOKEN"]
          account = os.environ["CF_ACCOUNT_ID"]
          boundary = uuid.uuid4().hex
          with open("index.html", "rb") as f:
              file_data = f.read()
          body = b""
          manifest = {"index.html": {"content_type": "text/html"}}
          body += f"--{boundary}\r\n".encode()
          body += b'Content-Disposition: form-data; name="manifest"\r\n'
          body += b"Content-Type: application/json\r\n\r\n"
          body += json.dumps(manifest).encode() + b"\r\n"
          body += f"--{boundary}\r\n".encode()
          body += b'Content-Disposition: form-data; name="index.html"; filename="index.html"\r\n'
          body += b"Content-Type: text/html\r\n\r\n"
          body += file_data + b"\r\n"
          body += f"--{boundary}--\r\n".encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/iglu-price/deployments",
              data=body, method="POST",
              headers={"Authorization": f"Bearer {token}",
                       "Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  d = json.loads(resp.read())
                  if d.get("success"):
                      print("✅ 已部署到 Cloudflare Pages:", d["result"]["url"])
                  else:
                      print("❌ 部署失败:", d.get("errors"))
                      raise SystemExit(1)
          except urllib.error.HTTPError as e:
              print("❌ 部署失败:", e.code, e.read().decode()[:200])
              raise SystemExit(1)
          PYEOF
